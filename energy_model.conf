# Attribution mode:
#   psys  - distribute sampled PSYS interval energy across requests/processes
#   model - apply the configured coefficients directly as microjoule weights
attribution_mode=psys

# Default multiplier applied when no exact freq_khz entry exists.
# In attribution_mode=psys these are score multipliers.
# In attribution_mode=model these are direct microjoule-per-nanosecond coefficients.
# Values are fixed-point scalars from userspace:
#   1.0 means "delta += runtime_ns * 1.0"
#   1.5 means "delta += runtime_ns * 1.5"
default_multiplier=1.0

# Penalty added every time the request-owning thread triggers sched_wakeup
# or sched_wakeup_new while the request is active.
# In attribution_mode=model the unit is microjoules per event.
wakeup_penalty=50000

# Additional weighted signal terms added on each sched-out slice.
# These use the same fixed-point format as the frequency multipliers.
# In attribution_mode=model they are direct microjoule-per-count coefficients.
cycles_weight=0.00
instructions_weight=0.00
cache_miss_weight=0.00

# Penalty added on each task migration affecting the request-owning thread.
# In attribution_mode=model the unit is microjoules per event.
migration_penalty=0

# Idle baseline in microwatts. This is subtracted from each sampled PSYS interval
# before the remaining system energy is split across processes.
idle_power_uw=0

# How often userspace samples PSYS and recomputes the live uJ/score factor.
psys_interval_ms=200

# Optional CPU frequency bucket size in kHz. A value of 0 keeps exact matching.
freq_bin_khz=0

# Per-frequency multipliers, keyed by CPU frequency in kHz after optional bucketing.
# Format: freq_khz=<khz> <multiplier>
freq_khz=800000 0.80
freq_khz=1400000 1.00
freq_khz=2200000 1.35
